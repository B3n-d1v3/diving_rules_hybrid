name: diving_rules_hybrid
description: A mobile app to learn the World Aquatics Diving Rules.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.

version: 3.0.1+26
# v3.0.1+26 <- Corrections of the penalty description typos or formulations
# v3.0.0+25 <- Update to rules WA of Feb 2026 in EN and in FR / Addition of new penalty descriptions or split into multiple questions / Various updates of new dependencies
# v2.6.4+24 <- Change of the language order / New version to update in Google Play store with Android api level 35
# v2.6.3+23 <- Updated name of the app to Diving Rules instead of Diving Rule 22 / Added in the About the local rulebook version
# v2.6.2+22 <- Update of the EN rulebook form Jul 2025 / add the DE Language and rulebook / add of IT rulebook / updated the ES language
# v2.6.1+21 <- Creation of the MacOS version of the app
# v2.6.0+20 <- Update Dependencies and language support update / Add the German Language
# v2.5.0+19 <- add the EN rulebook form Feb 2025
# v2.4.1+18 <- add the EN rulebook form July 2024 with the bookmarks set and optimize file size
# v2.4.0+17 <- add the EN rulebook form July
# v2.3.1+16 <- fix ios font and pdf copy feature update / added pdf bookmarks access / Corrected and localized the selection menu options
# v2.3.0+15 <- updated version of the rules EN to v3 (01/01/2024) inc bookmarks & optimized size, added about reference details
# v2.2.3+14 <- updated version of the rules EN with Bookmarks and optimized the pdf files and corrected the search close
# v2.2.2+13 <- contact updated to feedback
# v2.2.0  & 2.2.1 <- Rule book pdf management updates (search & copy)
# v2.1.1 <- Correction of the rulebook Language rules
# v2.1.0 <- Addition of the Mexican version of the rulebook
# v2.0.1+8 <- Launch for iOS replacement of initial app (20 Aug 2023)
# v2.0.0+5 <- initial launch for Android (11 Aug 2023)

environment:
  #sdk: 3.2.0 ' >=3.10.0 <4.0.0'
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localization setup
  flutter_localizations:
    sdk: flutter
  # intl: ^0.18.0
  # intl: ^0.19.0
  intl: ^0.20.2

#  syncfusion_localizations: ^31.1.20 upgradable ^31.2.18
  syncfusion_localizations: ^33.2.7

  # Package version number retrieval
  # package_info_plus: ^9.0.0 upgradable ^9.0.1
  package_info_plus: ^9.0.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # cupertino_icons: ^1.0.8
  cupertino_icons: ^1.0.9
  # shared_preferences: ^2.5.3
  shared_preferences: ^2.5.5
  # provider: ^6.1.5
  provider: ^6.1.5+1
  # syncfusion_flutter_pdfviewer: ^31.1.20 upgradable ^31.2.18
  syncfusion_flutter_pdfviewer: ^33.2.6

  # get: ^4.7.2
  get: ^4.7.3
  # flutter_svg: ^2.2.1
  flutter_svg: ^2.3.0
  # url_launcher: ^6.3.1
  url_launcher: ^6.3.2
  # share_plus: ^12.0.0 upgradable ^12.0.2
  share_plus: ^12.0.2






dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  #flutter_lints: ^5.0.0
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Localization setup
  generate: true


  # To add assets to your application, add an assets section, like this:
  # assets:
